site_name: kdocs
site_description: ゲーム制作のための C++23 標準ライブラリ ノート
site_url: https://qwzxdf.github.io/kdocs/
repo_url: https://github.com/qwzxdf/kdocs
repo_name: qwzxdf/kdocs
edit_uri: edit/main/docs/
copyright: kdocs

exclude_docs: |
  _template.md

theme:
  name: material
  language: ja
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: ライトモードに切り替え
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: システム設定に合わせる
  font:
    text: Noto Sans JP
    code: JetBrains Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

hooks:
  - hooks/autolink.py

plugins:
  - search:
      lang: ja
      separator: '[\s\-、。，．,:!=\[\]()"/<>{}]+|\.(?!\d)|&[lg]t;'
  - awesome-pages
  - tags

extra_javascript:
  - javascripts/godbolt.js
  - javascripts/spoiler.js
  - javascripts/home.js
  - javascripts/toc.js
  - javascripts/anim.js
  - javascripts/search-tune.js

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.keys
  - pymdownx.mark

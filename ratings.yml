# 描画の項目の評価。docs からの相対パス: {perf, quality}
# perf: 1 = 軽い / 2 = 普通 / 3 = 重い（GPU の負荷の目安）
# quality: 1 = 簡易 / 2 = 標準 / 3 = 高い（見た目の正確さ・きれいさ）
# quality を書かない = 好みや表現の問題で、「高いほど良い」とは言えない項目
# perf を書かない = 手法の比較・理論など、負荷を一つに決められないページ


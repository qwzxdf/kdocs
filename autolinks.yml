# 自動リンクの用語リスト
#
# 書き方:  リンク先のページ（docs フォルダからのパス）: [用語, 用語, ...]
#
# - ページ本文にここの用語が出てくると、そのページで最初の 1 回だけ自動でリンクになります。
# - 「std::vector」「<cmath>」のような C++ の名前は、各ページの title から自動で登録されます。
#   ここには日本語の用語や、別名（std:: を付けない vector など）を書きます。
# - 長い用語が優先されます（「const 参照」は「参照」より先に探されます）。
# - 英数字の用語は、単語の途中には反応しません（vector は vectors や myvector にはリンクしない）。
# - stl/ のページへの小文字だけの短い名前（set、list、map など）は、`set` のようなコード表記のときだけリンクします
#   （普通の英単語として出てきたときに誤ってリンクしないため）。

# 毎回リンクにする用語（最初の 1 回だけではなく、出てくるたびに）
_repeat: [O(1), 償却 O(1), 償却O(1), O(log n), O(n), O(n log n), O(n²), O(n^2)]


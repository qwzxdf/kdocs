- terms: [リマップ, remap]
  text: ある範囲の値を、別の範囲の値に写すこと。
  link: gamemath/interpolation.md
- terms: [デッドゾーン, dead zone, deadzone]
  text: スティックを中央付近で倒しても、入力として扱わない範囲。

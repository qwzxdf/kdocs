  link: 3d/depth-culling.md
- terms: [スカイボックス, skybox]
  text: 空を、箱の 6 面の画像で表す方法。
  link: 3d/mesh-textures.md
- terms: [キューブマップ, cubemap]
  text: 立方体の 6 面の画像。全方向の景色や反射に使う。
  link: 3d/mesh-textures.md
- terms: [スポットライト, spotlight, ポイントライト, ディレクショナルライト]
  text: 光源の種類。スポットは円錐状、ポイントは全方向、ディレクショナルは太陽のように平行な光。

- terms: [アイソメトリック, isometric]
  text: 斜め上から見下ろした、立体的に見える 2D の表現。
  link: gamemath/grids.md
- terms: [極座標, polar]
  text: 距離と角度で、位置を表す座標。
  link: gamemath/grids.md
- terms: [ラジアン, radian]

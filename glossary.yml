  link: encoding/unicode-basics.md
- terms: [コードポイント, code point]
  text: Unicode で、文字 1 つに割り当てられた番号。
  link: encoding/unicode-basics.md
- terms: [コードページ, code page]
  text: Windows で、文字コードの種類を表す番号。932 が Shift_JIS。
  link: encoding/windows-api.md
- terms: [バックスラッシュ, backslash, \\]
  text: 記号の「\」。Windows のパスの区切りや、エスケープに使う。
  link: encoding/source-files.md
- terms: [エスケープ, escape]
  text: 特別な意味のある文字を、普通の文字として書くための書き方。
  link: encoding/source-files.md
- terms: [タイムスタンプ, timestamp]
  text: 時刻の記録。ファイルの更新日時など。
  link: optimize/loading.md
- terms: [ミリメートル]
  text: 長さの単位。1 メートルの 1000 分の 1。
  link: gamemath/numeric.md
- terms: [チェックサム, checksum]
  text: データが壊れていないか確かめるための、短い値。
  link: engine/serialization/index.md
- terms: [ストリーム, stream]
  text: データの流れ。ファイルや入出力を、順に読み書きする。
  link: basics/file-io.md
- terms: [ハイブリッド, hybrid]
  text: 2 つの方式を、組み合わせたもの。
  link: rendering/lod.md
- terms: [バリエーション, variation, バリアント, variant]
  text: 同じものの、少し違う種類。シェーダーの組み合わせなど。
  link: rendering/shader-cost.md
- terms: [クエスト, quest]
  text: ゲームの中で、プレイヤーに与える依頼や目的。
  link: gamemath/balance.md
- terms: [インベントリ, inventory]
  text: プレイヤーが持っている、アイテムの一覧。
  link: engine/serialization/index.md
- terms: [NPC, ノンプレイヤーキャラクター]
  text: プレイヤーが操作しない、ゲームの中の住人や敵。
  link: libs/recast/index.md
- terms: [ARPG]
  text: アクション RPG。リアルタイムで戦う、ロールプレイング ゲーム。
  link: gamemath/balance.md
- terms: [VR, ブイアール]
  text: Virtual Reality。専用の装置で、仮想の世界を体験する技術。
  link: rendering/taa-upscaling.md
- terms: [BGM, 効果音]
  text: ゲームの背景に流れる音楽（BGM）や、動作に合わせた音（効果音）。
  link: engine/resource.md
- terms: [FMA]
  text: 掛け算と足し算を、1 つの命令で行う CPU の機能。結果の末尾の桁が、わずかに変わることがある。
  link: gamemath/numeric.md
- terms: [NEON, ARM]
  text: ARM は、スマートフォンなどの CPU の種類。NEON は、その SIMD 命令。
  link: optimize/simd.md
- terms: [LZ4]
  text: 非常に速い圧縮の方式。ゲームのデータの圧縮に使われる。
  link: optimize/loading.md
- terms: [LTCG, リンク時コード生成]
  text: リンクのときに、全体を見て最適化する機能。
  link: optimize/compiler.md
- terms: [LLVM]
  text: コンパイラの基盤と、それを使った C++ コンパイラ。
  link: basics/compiler.md
- terms: [LIFO]
  text: Last In First Out。最後に入れたものを、最初に取り出す順序。スタックの動き。
  link: optimize/allocators/stack.md
- terms: [IntelliSense]
  text: Visual Studio の、入力補完や、エラーの下線を出す機能。
  link: vs/tips.md
- terms: [HTTP, HTTPS]
  text: Web で通信するための決まり。
  link: vs/libraries.md
- terms: [DCC, DCC ツール]
  text: Blender・Maya など、3D のモデルやアニメーションを作るツール。
  link: 3d/model-basics.md
- terms: [CSS]
  text: Web ページの見た目を決める言語。
  link: libs/imgui/style.md
- terms: [CAD]
  text: 設計用のコンピューターのソフト。
  link: gamemath/curves.md
- terms: [BSD]
  text: ライセンスの種類（BSD ライセンス）。自由に使いやすい。
  link: libs/index.md
- terms: [BC4, BC6H]
  text: GPU が直接読める、テクスチャの圧縮形式。
  link: rendering/texture-streaming.md
- terms: [KTX2, KTX]
  text: GPU 向けに圧縮したテクスチャを入れる、ファイル形式。
  link: rendering/texture-streaming.md
- terms: [POD, trivial, トリビアル]
  text: 単純なデータだけの型。memcpy でコピーしても安全。
  link: engine/serialization/index.md
- terms: [PVS, Potentially Visible Set]
  text: ある場所から、見える可能性のあるものを、事前に計算した一覧。
  link: rendering/culling.md
- terms: [TBB]
  text: Intel の、並列処理のライブラリ。
  link: optimize/multithreading.md
- terms: [RPC]
  text: 別のコンピューターの関数を、呼び出す仕組み。
  link: engine/serialization/index.md
- terms: [マルチスレッド]
  text: 複数のスレッドで、同時に処理すること。
  link: optimize/multithreading.md
- terms: [F5, F9, F10, F11]
  text: Visual Studio のショートカット。F5 は実行、F9 はブレークポイント、F10・F11 はステップ実行。
  link: vs/debugging.md
- terms: [ブレークポイント, breakpoint]
  text: デバッグで、プログラムを止める位置の印。
  link: vs/debugging.md
- terms: [ブラウザ, ブラウザー, browser]
  text: Web ページを見るソフト。
  link: vs/tips.md
- terms: [ミキサー, mixer]
  text: 複数の音を混ぜて、音量を調整する部品。
  link: engine/resource.md
- terms: [FMOD, Wwise]
  text: ゲーム向けの、音のライブラリ（ミドルウェア）。
  link: engine/resource.md
- terms: [TRS 行列]
  text: 平行移動・回転・拡大を、まとめた行列。
  link: gamemath/matrices.md
- terms: [PCSS, Percentage-Closer Soft Shadows, 接触硬化]
  text: 遮蔽物との距離で影のぼけの幅を変え、接触部は鋭く遠いほどぼかす方法。
  link: graphics/shadows/pcss.md
- terms: [VSM, Variance Shadow Maps, ESM, EVSM, MSM, 光漏れ]
  text: 深度の平均と 2 乗平均を保存し、ぼかしたうえで影を求める方式（光漏れが弱点）。
  link: graphics/shadows/vsm/esm.md
- terms: [コンタクトシャドウ, コンタクト シャドウ, Contact Shadows]
  text: 深度バッファ上で光の方向へ短いレイを進め、接触部の細かい影を補う方法。
  link: graphics/shadows/contact-shadows.md
- terms: [仮想シャドウマップ, 仮想シャドウ マップ, Virtual Shadow Maps]
  text: 巨大な仮想解像度の影マップを、画面に必要なページだけ実体化して使う方式。
  link: graphics/shadows/virtual-shadow-maps.md
- terms: [シャドウボリューム, シャドウ ボリューム, Shadow Volumes]
  text: シルエットを光と反対へ押し出した体積を作り、ステンシルで影を判定する方式。
  link: graphics/shadows/shadow-volumes.md
- terms: [ExecuteIndirect, コマンドシグネチャ, コマンド シグネチャ]
  text: GPU が書いた引数バッファから、描画やディスパッチを連続して発行する D3D12 の機能。
  link: rendering/gpu-driven-dx12/execute-indirect.md
- terms: [ビンドレス, Bindless, ResourceDescriptorHeap]
  text: テクスチャ等を、バインドせず、ヒープ内の番号でシェーダーから直接引く方式。
  link: rendering/gpu-driven-dx12/bindless.md
- terms: [メッシュレット, Meshlet]
  text: メッシュを数十〜百数十個の三角形の塊に分け、塊ごとにカリングできるようにしたもの。
  link: rendering/gpu-driven-dx12/meshlets.md
- terms: [増幅シェーダー, Amplification Shader]
  text: メッシュ シェーダーの前段で、メッシュレットをカリングして起動数を決めるシェーダー。
  link: rendering/gpu-driven-dx12/meshlets.md

- terms: [プローブ, Probe, ライト プローブ]
  text: 空間の点に、周囲の光（放射照度や周囲の画像）を保存したもの。間接光や反射に使う。
  link: graphics/gi/ddgi.md
- terms: [ブラー, Blur, ぼかし]
  text: 画像をぼかす処理。ガウス ブラー、モーション ブラーなどがある。
  link: graphics/postprocess/motion-blur/index.md
- terms: [トーンマップ, Tone Mapping]
  text: HDR の明るさを、画面に出せる 0〜1 の範囲に収める変換。
  link: graphics/postprocess/tonemapping/index.md
- terms: [ガンマ, Gamma, sRGB]
  text: 明るさを人の見え方に合わせて変える曲線。リニアで計算し、最後に sRGB へ変換する。
  link: gamemath/color.md
- terms: [リニア, Linear, リニア空間]
  text: 光の量にそのまま比例する値の空間。ライティングの計算はリニアで行う。
  link: 3d/pbr.md
- terms: [レイトレ]
  text: 光線（レイ）を飛ばして、当たった物を調べる描画方式。
  link: graphics/reflections/rt-reflections.md
- terms: [コンピュート]
  text: 描画とは別に、GPU で汎用の計算を行うシェーダー。
  link: rendering/light-culling.md
- terms: [フォールバック, Fallback]
  text: 主な方法が使えないときに切り替える、代わりの方法。
  link: graphics/reflections/ssr-fallback.md
- terms: [クランプ, Clamp]
  text: 値を、決めた範囲に収めること。範囲外は端の値になる。
  link: graphics/postprocess/antialiasing/index.md
- terms: [オイラー]
  text: 回転を、X・Y・Z 軸まわりの 3 つの角度で表す方法。
  link: gamemath/rotation.md
- terms: [エイリアシング, Aliasing]
  text: 連続した絵を画素で切り取るときに出る、階段状のギザギザ。
  link: graphics/postprocess/antialiasing/index.md
- terms: [アクネ, シャドウ アクネ, Shadow Acne]
  text: 自分自身の影で、面にしま模様が出る現象。バイアスで防ぐ。
  link: graphics/shadows/bias/index.md
- terms: [スペキュラ, Specular, 鏡面反射]
  text: 光がなめらかな面で、鏡のように反射する成分。ハイライトを作る。
  link: graphics/ao/gtao.md
- terms: [オクルージョン, Occlusion, 遮蔽]
  text: ある物が別の物に隠される（光や視線が遮られる）こと。
  link: graphics/shadows/pcss.md
- terms: [ジッター, Jitter]
  text: サンプル位置をフレームごとに少しずらすこと。TAA などで使う。
  link: graphics/postprocess/motion-blur/index.md
- terms: [カーネル, Kernel, フィルタ カーネル]
  text: 周囲の画素に掛ける重みの並び。ぼかしなどのフィルタを表す。
  link: graphics/shadows/pcf.md
- terms: [コントラスト, Contrast]
  text: 明るい所と暗い所の差。
  link: graphics/postprocess/tonemapping/index.md
- terms: [シェーディング, Shading]
  text: 面の明るさや色を、光と素材から計算する処理。
  link: graphics/reflections/rt-reflections.md
- terms: [アーティファクト, Artifact]
  text: 処理の副作用で出る、本来ない見た目の乱れ。
  link: graphics/ao/artifacts/index.md
- terms: [ハロー, Halo]
  text: 明るい物や縁の周りに出る、にじんだ輪のような見た目の乱れ。
  link: graphics/ao/artifacts/halo.md
- terms: [バイリニア, Bilinear, バイリニア補間]
  text: 周囲 4 点を線形補間して、なめらかに値を取り出す方法。
  link: gamemath/interpolation.md
- terms: [トライリニア, Trilinear]
  text: バイリニアに、ミップ レベル間の補間も加えた方法。
  link: 3d/mesh-textures.md
- terms: [マスク, Mask]
  text: どこを処理するかを表す、白黒（0/1）の画像やデータ。
  link: stl/containers/bitset.md
- terms: [コーン, Cone, 円錐]
  text: 円錐の形。コーン トレースや背面コーンなど。
  link: graphics/gi/voxel-gi.md
- terms: [ディスパッチ, Dispatch]
  text: コンピュート シェーダーを、指定の数のグループで起動すること。
  link: rendering/gpu-driven-dx12/meshlets.md
- terms: [プリパス]
  text: 本描画の前に、深度だけを先に描くパス。
  link: rendering/overdraw.md
- terms: [パンニング, ピーター パンニング, Peter Panning]
  text: 影が物体から浮いて見える現象。バイアスが大きすぎると起きる。
  link: graphics/shadows/bias/peter-panning.md
- terms: [モンテカルロ, Monte Carlo, モンテカルロ法]
  text: ランダムなサンプルの平均で、積分を近似する方法。
  link: graphics/ao/theory/index.md
- terms: [グレイン, Film Grain, フィルム グレイン]
  text: フィルムの粒子のような、細かいノイズ。
  link: graphics/postprocess/lens-effects/film-grain.md
- terms: [ビネット, Vignette, 周辺減光]
  text: 画面の周辺が暗くなる効果。
  link: graphics/postprocess/lens-effects/vignette.md
- terms: [ガウス, Gaussian, ガウス分布, ガウシアン]
  text: 釣り鐘型の分布。ぼかしの重みに使う。
  link: graphics/postprocess/bloom/gaussian.md
- terms: [ポワソン, Poisson, ポワソン円盤]
  text: 点が近づきすぎないように、ばらけて並べた分布。
  link: graphics/shadows/pcf.md
- terms: [デノイザ]
  text: ノイズの多い画像から、ノイズを取り除くフィルタ。
  link: graphics/shadows/ray-traced.md
- terms: [スキャッター, Scatter]
  text: 画素を周りへ広げて描く方式。ボケ玉などに使う。
  link: graphics/postprocess/dof/scatter.md
- terms: [フレア, Lens Flare, レンズ フレア]
  text: 明るい光源がレンズ内で反射して出る、光のにじみや像。

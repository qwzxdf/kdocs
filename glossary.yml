# 用語のホバー説明
#
# - ページ本文に、ここの用語が出てくると、そのページで最初の 1 回だけ、マウスを乗せたときに説明が出ます。
# - terms のどれかが見つかれば、説明が付きます（同じ意味の言葉を、まとめて書けます）。
# - 見出し・コード・リンクの中は、対象外です。
# - 英数字の用語は、単語の途中には反応しません。

- terms: [ボーン, ジョイント, bone, joint, Bone, Joint, 骨]
  text: ボーン（骨）とジョイント（関節）は、ゲームでは同じものとして考えられることが多い。厳密には、ボーン＝骨そのもの、ジョイント＝骨と骨をつなぐ点。glTF では joint、FBX・Blender では bone と呼ぶ。
  link: 3d/skinning-animation.md
- terms: [スキニング, スキン, skinning, スキンメッシュ, スキンアニメーション]
  text: ボーンの動きに合わせて、メッシュ（皮膚）を変形させる仕組み。各頂点が、近くのボーン 1〜4 本の重み付き平均で動く。
  link: 3d/skinning-animation.md
- terms: [頂点, バーテックス, vertex, vertices, 頂点バッファ]
  text: 形の角になる点。位置のほか、法線・UV などの情報を持つ。
  link: 3d/model-basics.md
- terms: [メッシュ, mesh, Mesh]
  text: 3D モデルの形そのもの。頂点と三角形の集まり。色や絵（テクスチャ）は含まない。
  link: 3d/model-basics.md
- terms: [ポリゴン, polygon, 三角形, トライアングル]
  text: 頂点 3 つ（以上）で囲まれた面。3D 描画の基本単位は三角形。
  link: 3d/model-basics.md
- terms: [テクスチャ, texture, テクスチャー]
  text: 画像。
  link: 3d/model-basics.md
- terms: [UV 座標, UV, uv, UV マップ, UV 展開, テクスチャ座標]
  text: テクスチャ画像の、どの位置を使うかを表す 2 つの数字 (u, v)。
  link: 3d/model-basics.md
- terms: [法線, ノーマル, normal, 法線ベクトル, 法線マップ, ノーマルマップ]
  text: 面（または頂点）が向いている方向を表す、長さ 1 のベクトル。陰影の計算に使う。
  link: 3d/lighting-normals.md
- terms: [ワールド行列, world matrix, モデル行列, ワールド変換, ワールド座標]
  text: モデルの座標を、ゲーム世界の座標に変換する行列（拡大・回転・平行移動をまとめたもの）。
  link: 3d/transforms-mvp.md
- terms: [ビュー行列, view matrix, カメラ行列, ビュー変換, ビュー空間]
  text: ゲーム世界の座標を、カメラから見た座標に変換する行列。
  link: 3d/transforms-mvp.md
- terms: [プロジェクション行列, 射影行列, projection matrix, 投影行列, 射影変換, プロジェクション]
  text: カメラから見た 3D の座標を、遠近感のある画面向けの座標に変換する行列。
  link: 3d/projection.md
- terms: [クォータニオン, 四元数, quaternion, Quaternion]
  text: 回転を表す 4 つの数字 (x, y, z, w)。ジンバルロックがなく、補間も滑らか。
  link: gamemath/rotation.md
- terms: [ジンバルロック, gimbal lock]
  text: オイラー角で、2 つの回転軸が重なり、回転の自由度が 1 つ失われる現象。
  link: gamemath/rotation.md
- terms: [オイラー角, Euler, euler, ヨー, ピッチ, ロール]
  text: X・Y・Z 軸まわりの 3 つの角度で、回転を表す方法。
  link: gamemath/rotation.md
- terms: [同次座標, homogeneous, ホモジニアス]
  text: 3D の座標に 4 つ目の値 w を足した表し方。平行移動も、行列の掛け算で表せる。
  link: gamemath/matrices.md
- terms: [正規化, normalize, Normalize, ノーマライズ]
  text: ベクトルの向きはそのままで、長さを 1 にすること。
  link: gamemath/vectors.md
- terms: [内積, dot, Dot, ドット積, dot product]
  text: 2 つのベクトルが、どれだけ同じ向きかを表す数。正規化していれば cosθ。
  link: gamemath/vectors.md
- terms: [外積, cross, Cross, クロス積, cross product]
  text: 2 つのベクトルに垂直なベクトルを作る計算。面の法線を求めるときなどに使う。
  link: gamemath/vectors.md
- terms: [線形補間, Lerp, lerp, リニア補間, 線形補完]
  text: 2 つの値の間を、割合 t で直線的に混ぜること。a + (b − a) × t。
  link: gamemath/interpolation.md
- terms: [Slerp, 球面線形補間, slerp, スラープ]
  text: 2 つの回転の間を、一定の速さで補間する方法（球面上を進む）。
  link: gamemath/rotation.md
- terms: [レイキャスト, ray cast, Raycast, raycast, レイ, 光線]
  text: 線（レイ）を飛ばして、最初に当たるものを調べること。射撃・視線・ピッキングに使う。
  link: 3d/picking-raycast.md
- terms: [ピッキング, picking, オブジェクト選択]
  text: 画面上のクリック位置から、3D 空間のどの物体を指したかを求めること。
  link: 3d/picking-raycast.md
- terms: [AABB, 軸平行境界ボックス, バウンディングボックス, 境界ボックス]
  text: 軸に平行な箱（Axis-Aligned Bounding Box）。判定が速い。
  link: 3d/collision-3d.md
- terms: [OBB, 有向境界ボックス]
  text: 回転した箱（Oriented Bounding Box）。AABB より正確だが、重い。
  link: 3d/collision-3d.md
- terms: [BVH, bounding volume hierarchy, バウンディングボリューム階層]
  text: 物体を箱で包み、木構造にした空間分割。衝突判定やレイキャストを速くする。
  link: optimize/algorithms.md
- terms: [ブロードフェーズ]
  text: 衝突判定の第 1 段階。当たりそうな組み合わせを、安く絞り込む。
  link: 3d/collision-3d.md
- terms: [ナローフェーズ]
  text: 衝突判定の第 2 段階。絞り込んだ組み合わせを、正確に判定する。
  link: 3d/collision-3d.md
- terms: [トンネリング]
  text: 速い物体が、1 フレームで壁を通り抜けてしまう現象。
  link: gamemath/intersection.md
- terms: [剛体, rigid body, リジッドボディ, RigidBody]
  text: 形が変わらない、硬い物体。物理シミュレーションの基本単位。
  link: libs/jolt/bodies.md
- terms: [ラグドール, ragdoll, Ragdoll]
  text: ボーンごとの剛体と関節でできた、力の抜けた体の表現。倒れたキャラクターに使う。
  link: libs/jolt/character.md
- terms: [視錐台, frustum, Frustum, フラスタム]
  text: カメラに見える範囲を表す、四角錐を切った形。
  link: 3d/depth-culling.md
- terms: [カリング, culling, Culling, 視錐台カリング, バックフェイスカリング]
  text: 見えないものを、描画しないこと（裏向きの面・画面の外・隠れたもの）。
  link: rendering/culling.md
- terms: [深度バッファ, Z バッファ, Zバッファ, デプスバッファ, depth buffer, 深度テスト, デプステスト]
  text: ピクセルごとに、一番手前の距離を覚えておき、奥のものを描かないようにする仕組み。
  link: 3d/depth-culling.md
- terms: [Z ファイティング]
  text: ほぼ同じ深度の 2 つの面が、ちらちら入れ替わって見える現象。
  link: 3d/depth-culling.md
- terms: [ミップマップ, mipmap, ミップ, Mipmap, MIP]
  text: 縮小した画像のセット。遠くの面で使い、ちらつきを抑える。
  link: 3d/mesh-textures.md
- terms: [サンプラー, sampler, サンプラ]
  text: テクスチャを読むときのルール（補間・繰り返し・はみ出したときの扱い）。
  link: 3d/mesh-textures.md
- terms: [シェーダー, shader, シェーダ, HLSL]
  text: GPU 上で動く、頂点や色を計算する小さなプログラム。
  link: rendering/pipeline.md
- terms: [ドローコール, ドロー コール, 描画命令, draw call, Draw Call, ドロー コール数]
  text: CPU が GPU に出す、1 回の描画の命令。多いと CPU が重くなる。
  link: rendering/draw-calls.md
- terms: [インスタンシング, instancing, インスタンス描画]
  text: 同じメッシュを、1 回の描画命令で、大量に描く方法。
  link: rendering/draw-calls.md
- terms: [LOD, レベルオブディテール, Level of Detail]
  text: 遠くのものを、頂点の少ない簡易なモデルに切り替えること（Level of Detail）。
  link: rendering/lod.md
- terms: [PBR, 物理ベースレンダリング, Physically Based Rendering, 物理ベース]
  text: 光の物理的な振る舞いに沿って、陰影を計算する描画。材質は、色・金属度・粗さで表す。
  link: 3d/pbr.md
- terms: [IBL]
  text: 周囲の景色の画像（環境マップ）を、光源として使うライティング。
  link: 3d/pbr.md
- terms: [BRDF]
  text: ある方向から入った光が、ある方向へ、どれだけ反射するかを表す関数。
  link: 3d/pbr.md
- terms: [フレネル]
  text: 浅い角度で見るほど、反射が強くなる現象。
  link: 3d/pbr.md
- terms: [トーンマッピング]
  text: 明るさが 1 を超える HDR の値を、画面に出せる 0〜1 の範囲に収める処理。
  link: 3d/pbr.md
- terms: [HDR, ハイダイナミックレンジ]
  text: 1 を超える明るさを表せる、ダイナミックレンジの広い画像・計算（High Dynamic Range）。
  link: 3d/pbr.md
- terms: [ガンマ補正]
  text: 画面の明るさの特性に合わせて、色の値を変換すること。計算はリニア、表示は sRGB。
  link: gamemath/color.md
- terms: [SIMD, ベクトル化, ベクトル命令, AVX, SSE]
  text: 1 つの命令で、複数のデータをまとめて計算する、CPU の機能。
  link: optimize/simd.md
- terms: [キャッシュ, cache, Cache, キャッシュミス, キャッシュ効率]
  text: CPU の近くにある、小さくて速いメモリ。使うデータが近くにまとまっているほど速い。
  link: basics/cache.md
- terms: [キャッシュライン]
  text: CPU がメモリから一度に読む単位（通常 64 バイト）。
  link: optimize/memory-cache.md
- terms: [false sharing]
  text: 別々のスレッドが、同じキャッシュラインの別の変数を書き、互いに遅くなる現象。
  link: optimize/memory-cache.md
- terms: [ヒープ, heap, Heap]
  text: new や malloc で確保する、自由に使えるメモリ領域。確保・解放に時間がかかる。
  link: basics/heap.md
- terms: [ヒープ確保]
  text: new や malloc でヒープからメモリを確保すること。毎フレームの確保は避ける。
  link: optimize/frame-allocation.md
- terms: [スタック, stack, Stack, スタック領域]
  text: 関数のローカル変数を置く、高速なメモリ領域。関数を出ると自動で消える。
  link: optimize/allocation.md
- terms: [アロケータ, allocator, Allocator, アロケーター, メモリアロケータ]
  text: メモリを貸し出し（確保）、返してもらう（解放）仕組み。
  link: stl/memory/allocator.md
- terms: [断片化, フラグメンテーション, fragmentation]
  text: 確保と解放を繰り返して、細かい空きが散らばり、大きな要求に応えられなくなること。
  link: optimize/allocation.md
- terms: [アライメント, alignment, 境界, アラインメント]
  text: メモリ上のデータの開始位置を、その型の大きさの倍数に揃えること。
  link: optimize/memory-cache.md
- terms: [未定義動作, UB, undefined behavior, Undefined Behavior]
  text: 何が起きても、規格が保証しない操作。配列の範囲外アクセスなど。
  link: basics/ub.md
- terms: [RAII, Resource Acquisition Is Initialization]
  text: 資源の取得をコンストラクタ、解放をデストラクタで行う C++ の定番の設計。
  link: basics/ownership.md
- terms: [ムーブ, move, Move, ムーブセマンティクス, move semantics]
  text: コピーせず、中身を別の変数に移すこと（std::move）。
  link: basics/move.md
- terms: [ポインタ, pointer, Pointer, 生ポインタ, スマートポインタ]
  text: メモリ上の場所（アドレス）を持つ変数。
  link: basics/pointer.md
- terms: [テンプレート, template, Template, テンプレート引数]
  text: 型をあとから決められる、コードのひな形。
  link: basics/template.md
- terms: [ラムダ式, lambda, Lambda, ラムダ, クロージャ]
  text: その場で書ける、名前のない小さな関数。
  link: basics/lambda.md
- terms: [イテレータ, iterator, Iterator, イテレーター]
  text: コンテナの中の、今の位置を指すもの。
  link: basics/iterator.md
- terms: [シリアライズ, serialize, serialization, シリアライゼーション, 直列化, デシリアライズ]
  text: データを、ファイルに保存できる形に変換すること。
  link: engine/serialization/index.md
- terms: [ベイク, bake, Bake, ベイキング, baking, 焼き込み]
  text: 重い計算を、ビルド時に済ませて、結果をファイルに保存しておくこと。
  link: optimize/baking.md
- terms: [ゼロコピー]
  text: 読み込んだメモリを、コピーや作り直しをせずに、そのまま使うこと。
  link: optimize/serialization-speed.md
- terms: [constexpr, consteval, constinit, コンパイル時定数]
  text: コンパイル時に計算できることを示す指定。
  link: optimize/compile-time.md
- terms: [翻訳単位, translation unit, Translation Unit]
  text: 1 つの .cpp と、それが include したもの全部。コンパイルの単位。
  link: basics/compiler.md
- terms: [ODR]
  text: 定義は、プログラム全体で 1 つだけ、という規則（One Definition Rule）。
  link: basics/compiler.md
- terms: [プリプロセッサ]
  text: コンパイルの前に、#include や
  link: vs/preprocessor.md
- terms: [リンカー]
  text: 複数のオブジェクトファイルとライブラリを、1 つの実行ファイルにつなぐ道具。
  link: basics/compiler.md
- terms: [PCH, プリコンパイル済みヘッダー]
  text: 変わらないヘッダを、1 回だけ解析して、結果を再利用する仕組み。
  link: design/practice/build-cmake.md
- terms: [ECS, Entity Component System, エンティティ コンポーネント システム]
  text: データ（コンポーネント）と処理（システム）を分けて、大量のオブジェクトを速く扱う設計。
  link: design/patterns/ecs.md
- terms: [コンポーネント, component, Component]
  text: オブジェクトの機能を、部品として切り出したもの。
  link: engine/component.md
- terms: [ハンドル, handle, Handle]
  text: 消えるかもしれない相手を、番号と世代で安全に指すもの。
  link: engine/handle.md
- terms: [ステートマシン, state machine, State Machine, 有限状態機械, FSM]
  text: 状態と、状態の切り替えを、はっきり管理する仕組み。
  link: design/patterns/state-machine.md
- terms: [固定タイムステップ, fixed timestep, Fixed Timestep, 固定ステップ, 固定の刻み]
  text: 物理などを、毎回同じ時間の刻みで進める方法。結果が安定する。
  link: engine/game-loop.md
- terms: [フレームバジェット]
  text: 1 フレームの時間を、システムごとに配分した予算。
  link: optimize/frame-budget.md
- terms: [スパイク]
  text: 平均は良くても、たまに起きる、突然遅いフレーム。
  link: optimize/frame-budget.md
- terms: [AoS, Array of Structs, 構造体の配列]
  text: 構造体の配列。1 つの要素の全項目が、隣り合って並ぶ。
  link: optimize/memory-cache.md
- terms: [SoA, Struct of Arrays, 配列の構造体]
  text: 配列の構造体。項目ごとに、値が連続して並ぶ。
  link: optimize/memory-cache.md
- terms: [accessor]
  text: glTF で、バイナリデータの「読み方」（型・個数・場所）を表すもの。
  link: libs/tinygltf/structure.md
- terms: [bufferView]
  text: glTF で、バッファの「どこからどこまで」を表すもの。
  link: libs/tinygltf/structure.md
- terms: [IWYU, Include What You Use]
  text: 使っているものの、ヘッダを自分で include し、使わない include は消す、というルールとツール。
  link: optimize/build-time.md#iwyu
- terms: [ASan, AddressSanitizer]
  text: 実行中にメモリアクセスを監視して、範囲外アクセスや解放後の使用を、その場で検出するツール。
  link: vs/asan.md
- terms: [NOMINMAX]
  text: Windows の min / max マクロを、定義させないためのマクロ。
  link: vs/preprocessor.md
- terms: [vcpkg, VCPKG, Vcpkg]
  text: Microsoft が作った、C++ のパッケージ管理ツール。
  link: vs/libraries.md
- terms: [即時モード, immediate mode, Immediate Mode, 保持モード]
  text: 毎フレーム、描画の関数を呼ぶだけで GUI が出る方式（ImGui）。
  link: libs/imgui/basics.md
- terms: [ドッキング]
  text: ウィンドウを、ドラッグして、ほかのウィンドウの横やタブにくっつける機能。
  link: libs/imgui/docking.md
- terms: [ギズモ, gizmo, Gizmo]
  text: 3D の物体を、マウスで移動・回転・拡大するための、矢印や輪の操作部品。
  link: libs/imgui/imguizmo.md
- terms: [センサー, sensor, トリガー, Trigger]
  text: 衝突はせず、重なりだけを通知する物体（トリガー）。
  link: libs/jolt/bodies.md
- terms: [キネマティック, kinematic, Kinematic]
  text: プログラムが動かす物体。力は受けないが、ほかの物体を押す。
  link: libs/jolt/bodies.md
- terms: [スリープ, sleep, 休止, Sleep]
  text: 止まった物体を休止させて、計算を省く仕組み。
  link: libs/jolt/bodies.md
- terms: [ソフトボディ]
  text: 布やゴムのように、形が変わる柔らかい物体。
  link: libs/jolt/vehicles.md
- terms: [GPU, グラフィックスカード, グラフィックボード]
  text: 描画専用の部品。大量の頂点・ピクセルを、並列に計算する。
  link: rendering/pipeline.md
- terms: [CPU]
  text: プログラムを実行する、コンピューターの頭脳。
  link: rendering/pipeline.md
- terms: [バッファ, buffer, Buffer]
  text: データを置いておく、メモリの置き場。GPU 用のものは、頂点バッファ・定数バッファなど。
  link: 3d/mesh-textures.md
- terms: [定数バッファ, constant buffer, コンスタントバッファ, cbuffer]
  text: 行列や色など、少数の値を、シェーダーに渡すための GPU 側のバッファ。
  link: 3d/transforms-mvp.md
- terms: [インデックスバッファ, index buffer, インデックス]
  text: どの頂点で三角形を作るかを、番号で並べたリスト。頂点を使い回せる。
  link: 3d/model-basics.md
- terms: [入力レイアウト, input layout, InputLayout]
  text: 頂点バッファの中身の並びを、GPU に教える説明書。
  link: 3d/model-basics.md
- terms: [レンダーターゲット, render target, レンダー ターゲット, RTV]
  text: 描画の結果を書き込む先の画像（テクスチャ）。画面そのもの、または画面外のテクスチャ。
  link: rendering/pipeline.md
- terms: [SRV, シェーダーリソースビュー, Shader Resource View]
  text: シェーダーから、テクスチャなどを読むための見え方（ビュー）。
  link: libs/imgui/textures.md
- terms: [スワップチェーン, swap chain, SwapChain, ダブルバッファ]

- terms: [RT]
  text: Render Target（レンダーターゲット）の略。描画の結果を書く先の画像。
  link: rendering/pipeline.md
- terms: [チャンク, chunk]
  text: 大きなデータを、区切った 1 つのかたまり。マップを一定の大きさに分けたものなど。

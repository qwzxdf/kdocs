  link: stl/concurrency/thread.md
- terms: [ミューテックス, mutex, Mutex, 排他制御, ロック]
  text: 共有データを、同時に触らないように、鍵をかける仕組み。
  link: stl/concurrency/mutex.md
- terms: [アトミック, atomic, 原子操作, Atomic]
  text: 途中で割り込まれず、1 つの操作として完了する操作。
  link: stl/concurrency/atomic.md
- terms: [データ競合, data race, レースコンディション, race condition]
  text: 複数のスレッドが、同じデータを、同時に書き換えて壊れる問題。

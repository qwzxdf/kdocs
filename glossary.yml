- terms: [L1, L2, L3, L1 キャッシュ, L2 キャッシュ, L3 キャッシュ]
  text: CPU のキャッシュの階層。L1 が最も小さく速い。
  link: optimize/memory-cache.md
- terms: [スムージング, smoothing, 平滑化]
  text: 値を、なめらかに変化させること。カメラの追従などに使う。

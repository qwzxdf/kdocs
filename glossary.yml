- terms: [ISO, ICU, ISO 8859]
  text: 国際的な規格の名前や、文字を扱うライブラリ（ICU）。
  link: encoding/libraries.md
- terms: [TRS, 平行移動・回転・拡大]
  text: Translation（平行移動）・Rotation（回転）・Scale（拡大）の 3 つの変換を、まとめて表す形。
  link: 3d/transforms-mvp.md
- terms: [SSO, Small String Optimization]
  text: 短い文字列を、ヒープを使わず、文字列オブジェクトの中に入れる最適化。
  link: optimize/strings-hash.md
- terms: [IDE, 統合開発環境]
  text: エディタ・ビルド・デバッグを、まとめて使える開発ツール。Visual Studio など。
  link: vs/index.md
- terms: [GLFW]
  text: ウィンドウや入力を扱う、軽量なライブラリ（主に OpenGL・Vulkan 向け）。
  link: libs/imgui/basics.md
- terms: [CRLF, LF, 改行コード]
  text: 改行を表す文字の違い。Windows は CRLF、Unix 系は LF。
  link: encoding/source-files.md
- terms: [CCD, 連続衝突判定]

- terms: [レンズ, Lens]
  text: 光を集めて像を作る部品。ボケや収差の原因になる。
  link: graphics/postprocess/lens-effects/index.md
- terms: [ゲイン, Gain]
  text: 全体に掛ける倍率。特に明るい部分に強く効く。
  link: graphics/postprocess/color-grading/index.md
- terms: [シャープ, Sharpen, シャープネス]
  text: 輪郭をくっきりさせる処理。
  link: graphics/postprocess/antialiasing/index.md
- terms: [リゾルブ, Resolve]
  text: MSAA の複数サンプルを、1 画素にまとめること。
  link: graphics/postprocess/antialiasing/index.md
- terms: [トゥーン, Toon, セル シェーディング]
  text: アニメのように、陰影を少数の階調で表す描き方。
  link: graphics/postprocess/stylized/cel-shading.md
- terms: [ランバート, Lambert, ランバート反射]
  text: 面の明るさが、法線と光の向きの内積で決まる拡散反射。
  link: 3d/pbr.md
- terms: [バンディング, Banding]
  text: 滑らかなグラデーションに、段差の縞が出る現象。
  link: graphics/ao/artifacts/index.md
- terms: [ブロブ, Blob, ブロブ シャドウ]
  text: 足元に貼る、丸くて柔らかい影の画像。
  link: graphics/shadows/special-cases/index.md
- terms: [スロープ, Slope]
  text: 面の傾き。スロープ スケール バイアスで使う。
  link: graphics/shadows/bias/slope-scale-bias.md
- terms: [チェビシェフ, Chebyshev, チェビシェフの不等式]
  text: 平均と分散から、確率の上限を見積もる不等式。VSM で使う。
  link: graphics/shadows/vsm/index.md
- terms: [ヤコビアン, Jacobian]
  text: 座標を変換したときの、面積（体積）の変化率。
  link: graphics/gi/rt-gi.md
- terms: [ハーフベクトル, Half Vector]
  text: 光の向きと視線の向きの、ちょうど中間のベクトル。
  link: 3d/pbr.md
- terms: [フィルミック, Filmic]
  text: フィルムのような、S 字の階調特性。
  link: graphics/postprocess/tonemapping/filmic-hable.md
- terms: [ポスタライズ, Posterize]
  text: 色の階調数を減らす処理。
  link: graphics/postprocess/stylized/posterize-halftone.md
- terms: [ブリン フォン, Blinn-Phong, フォン]
  text: 鏡面反射を簡単な式で表す、古典的なライティング モデル。
  link: libs/imgui/fonts.md
- terms: [ヒューリスティック, Heuristic]
  text: 厳密ではないが、経験則でうまくいく方法。
  link: graphics/ao/artifacts/index.md
- terms: [アナモルフィック, Anamorphic]
  text: 横に引き伸ばされた像を作るレンズ。楕円のボケや横長のフレアが出る。
  link: graphics/postprocess/dof/index.md
- terms: [リダクション, Reduction]
  text: 多数の値を、合計や最大などの 1 つの値にまとめる処理。
  link: graphics/postprocess/dof/index.md
- terms: [レイマーチ, Ray Marching, レイ マーチ]
  text: レイを少しずつ進めながら、当たりを調べる方法。
  link: graphics/gi/ssgi.md
- terms: [クリッピング, Clipping]
  text: 描画範囲の外を切り捨てること。
  link: graphics/reflections/planar.md
- terms: [クリップマップ, Clipmap]
  text: 視点の周りを細かく、遠くを粗くした、入れ子のテクスチャ構造。
  link: graphics/shadows/virtual-shadow-maps.md
- terms: [サブピクセル, Subpixel]
  text: 1 画素より細かい位置。
  link: graphics/postprocess/antialiasing/index.md
- terms: [ボリューメトリック, Volumetric]
  text: 霧や雲のように、空間に広がる物を表す描き方。
  link: graphics/postprocess/lens-effects/index.md
- terms: [ルックアップ, Lookup]
  text: 入力に対する結果を、表から引く方法。
  link: graphics/postprocess/color-grading/index.md
- terms: [ピラミッド, Pyramid]
  text: 解像度を半分ずつにした画像の重ね（ミップ）。
  link: rendering/gpu-driven-dx12/hiz-two-pass.md
- terms: [ホライゾン, Horizon, 水平線]
  text: 地面や遮蔽物が作る、見える範囲の境界の角度。
  link: graphics/ao/hbao.md
- terms: [アウトライン, Outline, 輪郭線]
  text: 物体の周りの線。
  link: graphics/postprocess/stylized/outline-hull.md
- terms: [ホタル, ファイアフライ, Firefly]
  text: 極端に明るい 1 画素が、ちらつく現象。
  link: graphics/postprocess/bloom/karis-average.md
- terms: [リフィット, Refit]
  text: 加速構造の形はそのままに、境界の大きさだけを更新すること。
  link: graphics/reflections/rt-reflections.md
- terms: [サーフェス, Surface]
  text: 物体の表面。
  link: graphics/gi/rt-gi.md
- terms: [ダート, Dirt, レンズ ダート]
  text: レンズの汚れの模様。ブルームに重ねる。
  link: graphics/postprocess/bloom/composite.md
- terms: [ペイロード, Payload]
  text: あるステージから次へ渡す、運ぶデータ。
  link: rendering/gpu-driven-dx12/meshlets.md
- terms: [リードバック]
  text: GPU のデータを、CPU が読み戻すこと。
  link: rendering/gpu-driven-dx12/sync-debug.md
- terms: [バンプ, Bump, バンプ マップ]
  text: 凹凸を、法線などで表したもの。
  link: stl/memory/allocator.md
- terms: [ディレクショナル, Directional, 平行光]
  text: 遠くの光源のように、全体に同じ向きで当たる光。
  link: graphics/shadows/shadow-map-basics/index.md
- terms: [タイリング, Tiling]
  text: テクスチャを繰り返して貼ること。
  link: 3d/mesh-textures.md
- terms: [ブリーディング, Bleeding, カラー ブリーディング, ライト ブリーディング]
  text: 色や光が、隣へにじみ出る現象。
  link: graphics/gi/ssgi.md
- terms: [ランプ, Ramp, ランプ テクスチャ]
  text: 入力値に対して色を返す、1 次元のテクスチャ。
  link: graphics/postprocess/antialiasing/index.md
- terms: [テント, Tent, テント フィルタ]
  text: 中心が高く、端へ直線的に下がる形のフィルタ。
  link: graphics/postprocess/bloom/index.md
- terms: [シルエット, Silhouette]
  text: 物体の輪郭の形。
  link: graphics/shadows/shadow-volumes.md
- terms: [ミラー, Mirror]
  text: 鏡のように、周囲を映すこと。
  link: graphics/reflections/planar.md
- terms: [エンティティ, Entity]
  text: ゲームの中の「物」を表す、番号のようなもの（ECS）。
  link: design/patterns/ecs.md
- terms: [ダメージ, Damage]
  text: 攻撃で与える（受ける）体力の減少量。
  link: gamemath/balance.md
- terms: [アリーナ, Arena, アリーナ アロケータ]
  text: 大きな領域から順に切り出し、まとめて解放するメモリ確保の方式。
  link: stl/memory/allocator.md
- terms: [ドロー, Draw]
  text: GPU に 1 回の描画を依頼すること。
  link: libs/jolt/debug-renderer.md
- terms: [ジョブ, Job]
  text: 並列に実行できる、小さな作業の単位。
  link: optimize/multithreading.md
- terms: [ビジター, Visitor, ビジター パターン]
  text: データ構造を辿りながら、種類ごとに処理を呼ぶ設計パターン。
  link: design/patterns/visitor.md
- terms: [ストラテジー, Strategy, ストラテジー パターン]
  text: 処理の入れ替えを、オブジェクトで行う設計パターン。
  link: design/patterns/strategy.md
- terms: [デコレータ, Decorator]
  text: 機能を包んで足していく設計パターン。
  link: design/patterns/decorator.md
- terms: [ガチャ, Gacha]
  text: 確率でアイテムを得る仕組み。

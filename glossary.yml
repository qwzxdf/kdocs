- terms: [ブランチ, branch]
  text: 分岐。コードの if や、Git での枝分かれ。
  link: optimize/branching-virtual.md
- terms: [データベース, database]
  text: データを、整理して保存・検索する仕組み。
  link: engine/serialization/index.md
- terms: [プラグイン, plugin]
  text: 本体に、あとから機能を足す部品。
  link: libs/index.md
- terms: [オーバーヘッド, overhead]
  text: 本来の処理以外にかかる、余分な時間やメモリ。
  link: optimize/index.md
- terms: [オーバーレイ, overlay]
  text: 画面の上に、重ねて表示するもの。
  link: libs/imgui/debug-ui.md
- terms: [ゲームパッド, gamepad, コントローラー]
  text: ゲーム用の入力機器。スティックとボタンがある。
  link: gamemath/smoothing.md
- terms: [エイリアス, alias]
  text: 同じものにつけた、別の名前。using による型の別名など。
  link: basics/template.md
- terms: [ポリシー, policy]
  text: 振る舞いを決める、差し替えられる部品。
  link: design/patterns/crtp-policy.md
- terms: [ガベージコレクション, GC, garbage collection]
  text: 使われなくなったメモリを、自動で回収する仕組み。C++ にはない（RAII で管理する）。
  link: design/patterns/raii.md
- terms: [コルーチン, coroutine]
  text: 途中で止めて、あとから再開できる関数。
  link: basics/concurrency.md
- terms: [リフレクション, reflection]
  text: プログラムが、自分の型やメンバの情報を、実行中に調べる仕組み。
  link: engine/serialization/index.md
- terms: [セマフォ, semaphore]
  text: 同時に入れる数を、制限する同期の道具。
  link: optimize/multithreading.md
- terms: [ワーカー, worker, ワーカースレッド]
  text: 仕事を引き受けて処理する、スレッド。
  link: optimize/multithreading.md
- terms: [クラスター メッシュ, ワイヤーフレーム, wireframe]
  text: 面を塗らずに、辺だけを描く表示。メッシュの形を確認するのに使う。
  link: 3d/model-basics.md
- terms: [ミニマップ, minimap]
  text: 画面の隅に出す、小さな地図。
  link: gamemath/grids.md
- terms: [ポータル, portal]
  text: 部屋と部屋をつなぐ、入口。カリングで使う。
  link: rendering/culling.md
- terms: [ピボット, pivot]
  text: 回転や拡大の、中心になる点。
  link: 3d/transforms-mvp.md
- terms: [モーメント, 慣性モーメント]
  text: 回転のしにくさ。回転運動での質量にあたる。
  link: gamemath/motion.md
- terms: [サスペンション, suspension]
  text: 車のばねとダンパー。車輪の上下の動きを吸収する。
  link: libs/jolt/vehicles.md
- terms: [ヒットスキャン, hitscan]
  text: 撃った瞬間に、光線で当たりを判定する方式。弾が飛んでいかない。
  link: gamemath/intersection.md
- terms: [プリセット, preset]
  text: あらかじめ用意された、設定の組み合わせ。
  link: vs/settings.md
- terms: [ビットフラグ, bit flag, フラグ, flag]
  text: ビットの 1 つ 1 つを、オン・オフの印として使う方法。
  link: design/foundations/class-design.md
- terms: [バケット, bucket]
  text: 同じ性質のものを、まとめて入れる箱。ハッシュ テーブルの 1 マスなど。
  link: optimize/strings-hash.md
- terms: [スナップ, snap]
  text: 近い値や位置に、ぴったり吸い付けること。
  link: libs/imgui/imguizmo.md
- terms: [スロット, slot]
  text: 何かを入れる、差し込み口。
  link: engine/handle.md
- terms: [スポーン, spawn, リスポーン]
  text: 敵やアイテムなどを、ゲームの世界に出現させること。
  link: gamemath/random.md
- terms: [シャッフル, shuffle]
  text: 並びを、ランダムに入れ替えること。
  link: gamemath/random.md
- terms: [ダーティ, dirty, ダーティフラグ]
  text: 変更があって、更新が必要な状態。印をつけて、変わった所だけ処理する。
  link: optimize/frame-allocation.md
- terms: [トレードオフ, trade-off, tradeoff]
  text: 一方を良くすると、もう一方が悪くなる関係。
  link: optimize/index.md
- terms: [プロトタイプ, prototype]
  text: 試しに作った、簡単な試作品。
  link: engine/index.md
- terms: [プリミティブ, primitive]
  text: 基本になる、単純な形や型。三角形・球・箱など。
  link: 3d/model-basics.md
- terms: [プロファイラ]
  text: プログラムのどこに時間がかかっているかを、測る道具。
  link: optimize/measure.md
- terms: [マルチバイト, multibyte]
  text: 1 文字が、複数のバイトで表される文字コード。
  link: encoding/string-types.md
- terms: [サロゲート, surrogate, サロゲートペア]

  text: データを保存する装置。SSD は速く、HDD は遅い。
  link: optimize/loading.md
- terms: [テクセル, texel]
  text: テクスチャを構成する、1 つ 1 つの点（テクスチャのピクセル）。
  link: 3d/mesh-textures.md
- terms: [タイマー, timer]
  text: 時間を測る仕組み。
  link: optimize/measure.md
- terms: [スライダー, slider]
  text: つまみを動かして、値を決める部品。
  link: libs/imgui/widgets.md
- terms: [スプライト, sprite]
  text: 2D ゲームで、画面に置く、1 枚の絵。
  link: rendering/2d.md
- terms: [スナップショット, snapshot]
  text: ある時点の状態を、まるごと保存したもの。
  link: engine/serialization/index.md
- terms: [シグネチャ, signature]
  text: 関数の、名前・引数の型・戻り値の型の組み合わせ。
  link: design/foundations/interface-design.md
- terms: [RGB, RGBA カラー]
  text: 赤（R）・緑（G）・青（B）の強さで、色を表す方法。

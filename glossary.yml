- terms: [テッセレーション, tessellation]
  text: 面を、細かく分割して、三角形を増やす処理。
  link: rendering/lod.md
- terms: [デカール, decal]
  text: 壁や地面に、あとから貼る絵。弾痕・血しぶき・看板など。

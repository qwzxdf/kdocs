- terms: [固定小数点, fixed point]
  text: 整数を使って、小数を表す方法。どの環境でも同じ結果になる。
  link: gamemath/numeric.md
- terms: [疑似乱数, 乱数, random, PRNG, シード, seed]
  text: 規則的な計算で作る、ランダムに見える数の列。同じシードなら、同じ列が出る。

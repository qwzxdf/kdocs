- terms: [スカラー, scalar]
  text: 向きを持たない、ただの数。ベクトルの対になる言葉。
  link: gamemath/vectors.md
- terms: [スイープ, sweep]
  text: 図形を、動かしながら、その経路で当たりを調べること。
  link: gamemath/intersection.md
- terms: [クラスター, クラスタ, cluster]
  text: 近いものを、まとめたかたまり。描画では、3D の格子の 1 マスや、三角形の塊のこと。

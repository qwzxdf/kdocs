  link: rendering/bandwidth.md
- terms: [VRAM, ビデオメモリ, グラフィックスメモリ]
  text: GPU 専用のメモリ。テクスチャ・バッファ・レンダーターゲットを置く。
  link: rendering/texture-streaming.md
- terms: [オーバードロー, overdraw, Overdraw]
  text: 同じピクセルを何度も塗ること。隠れて見えなくなる分の計算が無駄になる。
  link: rendering/overdraw.md
- terms: [Early-Z, Early Z, アーリーZ, 早期深度テスト]
  text: ピクセルシェーダーの前に深度テストをして、隠れたピクセルの計算を省く、GPU の自動の最適化。
  link: rendering/overdraw.md
- terms: [Z プリパス, Zプリパス, 深度プリパス, depth prepass, Z prepass]
  text: 色の計算の前に、深度だけを先に描くパス。後の色のパスで、隠れた部分の計算を省ける。
  link: rendering/overdraw.md
- terms: [クアッド, quad overdraw, クアッドオーバードロー]
  text: GPU がピクセルを 2×2 の 4 つ組で実行する単位。小さな三角形だと、無駄になる計算が多い。
  link: rendering/overdraw.md
- terms: [Forward, フォワード, フォワードレンダリング, Forward Rendering]
  text: 物体を描くときに、その場でライティングまで計算する方式。ライトが多いと重い。
  link: rendering/forward-deferred.md
- terms: [Deferred, ディファード, ディファードレンダリング, Deferred Rendering, ディファードシェーディング]
  text: まず物体の情報を G-Buffer に書き、後で画面全体にライティングする方式。ライトが多くても、ピクセル数に比例した重さで済む。
  link: rendering/forward-deferred.md
- terms: [G-Buffer, Gバッファ, ジーバッファ, GBuffer]
  text: Deferred で、各ピクセルの色・法線・粗さなどを書いておく、画面サイズのテクスチャ群。
  link: rendering/forward-deferred.md
- terms: [ライトボリューム, light volume, ライト ボリューム]
  text: ライトが届く範囲を表す球や円錐。その範囲のピクセルだけを、ライティングする。
  link: rendering/forward-deferred.md
- terms: [Tiled, タイルド, Tiled Deferred, Tiled Forward, Forward+, フォワードプラス]
  text: 画面を 16×16 ほどのタイルに分け、タイルごとに影響するライトを絞り込む方式。
  link: rendering/light-culling.md
- terms: [Clustered, クラスタード, Clustered Deferred, Clustered Forward]
  text: 画面を奥行き方向にも分けた 3D の格子（クラスター）ごとに、ライトを絞る方式。奥行きが大きく違う場面に強い。
  link: rendering/light-culling.md
- terms: [ライトカリング, light culling, ライト カリング]
  text: 画面の各領域に、影響するライトだけを割り当てて、無駄なライト計算を省くこと。
  link: rendering/light-culling.md
- terms: [groupshared, グループ共有メモリ]
  text: コンピュートシェーダーで、同じスレッドグループ内のスレッドが共有する、高速な小さなメモリ。
  link: rendering/light-culling.md
- terms: [スレッドグループ, thread group, ワープ, warp, ウェーブ, wavefront]
  text: GPU が一緒に動かす、数十スレッドの組（NVIDIA はワープ、AMD はウェーブ）。同じ命令を同時に実行する。
  link: rendering/shader-cost.md
- terms: [ダイバージェンス, divergence]
  text: 同じ組のスレッドが、別々の分岐に進むこと。両方の道を順に実行するので遅くなる。
  link: rendering/shader-cost.md
- terms: [占有率, オキュパンシー, occupancy, Occupancy]
  text: GPU が同時に動かせるウェーブの数。多いほど、メモリ待ちを他のウェーブで隠せる。
  link: rendering/shader-cost.md
- terms: [レジスタ, register]
  text: シェーダーが使う、一時変数の置き場。多く使うと、同時に動かせる組が減る。
  link: rendering/shader-cost.md
- terms: [ALU]
  text: 足し算・掛け算などを行う、GPU の計算部分。
  link: rendering/shader-cost.md
- terms: [FP16, 半精度, min16float]
  text: 16 ビットの小数。32 ビットより精度は低いが、レジスタと演算が半分で済む。
  link: rendering/shader-cost.md
- terms: [異方性フィルタリング, 異方性, ミップレベル, mip level]
  text: ミップレベルは、遠い面ほど小さなミップを選ぶ仕組みの段数。異方性フィルタリングは、斜めに見える面で、ぼやけを減らす。
  link: rendering/texture-streaming.md
- terms: [BC 圧縮, BC7, BC1, BC3, BC5, DXT, ブロック圧縮, テクスチャ圧縮, 圧縮テクスチャ]
  text: テクスチャを GPU が直接読める形で小さくする方式。メモリと帯域を節約できる。
  link: rendering/texture-streaming.md
- terms: [テクスチャアトラス, texture atlas, アトラス, テクスチャ配列, texture array]
  text: 小さな画像を 1 枚にまとめたもの（アトラス）や、同じ大きさの画像を重ねたもの（配列）。テクスチャの切り替えを減らせる。
  link: rendering/draw-calls.md
- terms: [バインドレス, bindless, Bindless]
  text: テクスチャを、切り替えずに、番号で直接参照できる仕組み。1 回の描画で多数の材質を扱える。
  link: rendering/gpu-driven.md
- terms: [インダイレクト描画, indirect draw, Indirect Draw, DrawIndexedInstancedIndirect, ExecuteIndirect]
  text: 描画の引数（個数・開始位置）を、GPU 上のバッファから読んで描く方式。GPU 自身が描画内容を決められる。
  link: rendering/gpu-driven.md
- terms: [GPU Driven, GPU ドリブン, GPU Driven Rendering]
  text: カリングと描画命令の作成を、CPU ではなく GPU にやらせる方式。物体が数万個あっても CPU の負担が増えない。
  link: rendering/gpu-driven.md
- terms: [Meshlet, メッシュレット, meshlet]
  text: メッシュを、64 頂点ほどの小さな塊に分けたもの。塊ごとにカリングできる。
  link: rendering/mesh-shaders.md
- terms: [Mesh Shader, メッシュシェーダー, メッシュ シェーダー, Task Shader, Amplification Shader]
  text: Meshlet を直接処理する、新しいシェーダー段（DX12 Ultimate）。従来の頂点処理を置き換える。
  link: rendering/mesh-shaders.md
- terms: [Visibility Buffer, ビジビリティバッファ, 可視性バッファ]
  text: 材質の値の代わりに、三角形の ID だけを画面に書く方式。G-Buffer より書き込みが少ない。
  link: rendering/visibility-buffer.md
- terms: [Hi-Z, HZB, 階層的深度, Hierarchical Z]
  text: 深度バッファを、各段が「範囲内の最も奥の深度」になるように、縮小して重ねたもの。カリングやトレースを速くする。
  link: rendering/hiz.md
- terms: [オクルージョンカリング, occlusion culling, オクルージョン カリング]
  text: 他の物体に隠れて見えない物体を、描かないこと。
  link: rendering/culling.md
- terms: [フラスタムカリング, frustum culling]
  text: カメラの視界の外にある物体を、描かないこと。
  link: rendering/culling.md
- terms: [八分木, Octree, octree, オクツリー, 四分木, Quadtree, quadtree, kd-tree]
  text: 空間を再帰的に分けた木構造。近くの物体を、素早く探したり、まとめて除外できる。
  link: optimize/algorithms.md
- terms: [スクリーン空間, screen space, スクリーンスペース]
  text: 画面のピクセル座標で考える空間。SSAO や SSR は、画面の深度を使って計算する。
  link: rendering/hiz.md
- terms: [SSAO, スクリーン空間AO, SSAO（スクリーン空間 AO）]
  text: 画面の深度から、くぼみに生じる暗さ（環境光遮蔽）を近似する方法。
  link: graphics/ao/ssao-hemisphere.md
- terms: [HBAO, Horizon-Based AO]
  text: 方向ごとに深度バッファを歩き、地平線の角度を求めて、遮蔽を積分する AO。
  link: graphics/ao/hbao.md
- terms: [HBAO+]
  text: NVIDIA の高速な HBAO ライブラリ。フル解像度で、キャッシュに優しく計算する。
  link: graphics/ao/hbao-plus.md
- terms: [GTAO, Ground Truth AO]
  text: コサイン重みを正しく積分する、地平線ベースの AO。マルチ バウンスやスペキュラ遮蔽も扱える。
  link: graphics/ao/gtao.md
- terms: [Alchemy AO, AlchemyAO]
  text: AO の積分から導いた式を、サンプル点ごとに足す方式。SAO の元になった。
  link: graphics/ao/alchemy-ao.md
- terms: [SAO, Scalable AO, Scalable Ambient Obscurance]
  text: Alchemy AO の式に、深度のミップを組み合わせ、半径に依存しない速さにした方式。
  link: graphics/ao/sao.md
- terms: [RTAO, レイトレース AO, レイトレーシング AO]
  text: レイトレーシングで、シーンに直接レイを飛ばして求める AO。正確だが、ノイズ除去が必要。
  link: graphics/ao/world-space/rtao.md
- terms: [DFAO, 距離場 AO, 距離場AO]
  text: 符号付き距離場で円錐をトレースして求める AO。
  link: graphics/ao/world-space/dfao.md
- terms: [バイラテラルフィルタ, バイラテラルブラー, bilateral blur]
  text: 深度や法線が近い画素だけを混ぜる、境界を守るぼかし。
  link: graphics/ao/filtering/bilateral-blur.md
- terms: [ベント法線, bent normal, bent normals]
  text: 遮られていない方向の、平均の向き。環境光を引くときに、法線の代わりに使う。
  link: graphics/ao/gtao.md
- terms: [スペキュラ遮蔽, specular occlusion]
  text: 鏡面反射が、周囲に遮られて見えなくなる効果。AO・粗さ・視線から近似する。
  link: graphics/ao/gtao.md
- terms: [マルチバウンス, multi-bounce, マルチ バウンス]
  text: 光が、複数回、反射して回り込むこと。AO が暗くなりすぎないよう、アルベドで補正する。
  link: graphics/ao/gtao.md
- terms: [オブスキュランス, obscurance]
  text: 距離の減衰を足した、AO の一般化。近くの遮蔽だけが効く。
  link: graphics/ao/theory/obscurance.md
- terms: [IGN, Interleaved Gradient Noise, ブルーノイズ, blue noise]
  text: スクリーン空間のノイズ。ぼかしや時間蓄積で消えやすい質のよいノイズ。
  link: graphics/ao/filtering/index.md
- terms: [SSR, スクリーン空間反射, Screen Space Reflection]
  text: 画面に映っているものだけで、反射を計算する方法。画面外は映らない。
  link: graphics/reflections/ssr-basics.md
- terms: [平面反射, Planar Reflection, planar reflection]
  text: 反射面でカメラを鏡映して、シーンを描き直し、反射として使う方法。正確だが、平面だけで重い。
  link: graphics/reflections/planar.md
- terms: [リフレクションプローブ, リフレクション プローブ, reflection probe, 反射プローブ]
  text: ある点から見た全方向の景色を、キューブマップに撮っておき、反射に使う方法。
  link: graphics/reflections/probes.md
- terms: [視差補正, parallax correction, ボックス投影, box projection]
  text: プローブの位置と、反射する面の位置の、ずれを補正する処理。範囲を箱で近似して引き直す。
  link: graphics/reflections/probes.md
- terms: [Split-Sum, スプリットサム, BRDF LUT]
  text: 鏡面の積分を、事前フィルタした環境マップと、BRDF の積分（LUT）の 2 つに分けて近似する方法。
  link: graphics/reflections/probes.md
- terms: [GGX, Trowbridge-Reitz]
  text: 微小な面の向きの分布を表す、標準的な式。粗さで、ハイライトの形が決まる。
  link: graphics/reflections/ssr-stochastic.md
- terms: [VNDF, 可視法線サンプリング, visible normal sampling]
  text: 視線から見える向きだけを、確率的に選ぶ、GGX のサンプリング方法。無駄なレイが少ない。
  link: graphics/reflections/ssr-stochastic.md
- terms: [重要度サンプリング, importance sampling]
  text: 分布の山の部分から、多めにサンプルを取って、少ないサンプルで精度を上げる方法。
  link: graphics/reflections/ssr-stochastic.md
- terms: [確率的SSR, 確率的 SSR, Stochastic SSR]
  text: 粗さに合わせて、画素ごとにランダムなレイを飛ばし、近隣の再利用と時間蓄積で、ぼけた反射を作る方式。
  link: graphics/reflections/ssr-stochastic.md
- terms: [Hi-Z SSR, Hi-Z トレース]
  text: 階層的な深度で、空いた領域を飛ばしながらレイを進める SSR。
  link: graphics/reflections/ssr-hiz.md
- terms: [レイトレース反射, RT 反射, レイトレ反射]
  text: シーン全体にレイを飛ばして求める反射。画面外・裏側も映る。
  link: graphics/reflections/rt-reflections.md
- terms: [デノイザー, デノイズ, denoiser, denoise]
  text: レイトレなどのノイズだらけの結果を、空間と時間の平均で滑らかにする処理。
  link: graphics/reflections/rt-reflections.md
- terms: [バイラテラル, bilateral, アップサンプル, upsample]
  text: 深度などの違いを考慮して、境界をまたいで混ぜないようにするぼかし・拡大。縮小バッファの拡大に使う。
  link: rendering/low-res-effects.md
- terms: [ダウンサンプル, downsample, 縮小バッファ, 半分解像度, ハーフ解像度]
  text: 画像を小さくすること。縮小した解像度で効果を計算すると、計算量が大きく減る。
  link: rendering/low-res-effects.md
- terms: [ブルーム, bloom, Bloom]
  text: 明るい部分が、にじんで光って見える効果。
  link: rendering/postprocess.md
- terms: [被写界深度, DOF, depth of field]
  text: ピントの合った距離以外が、ぼやけて見える効果。
  link: rendering/postprocess.md
- terms: [ポストプロセス, post process, ポストエフェクト, post-process]
  text: 描き終わった画面全体に、後から掛ける効果（ブルーム・トーンマップなど）。
  link: rendering/postprocess.md
- terms: [TAA, 時間的アンチエイリアシング, テンポラル, temporal, TAAU]
  text: 毎フレーム少しずらして描き、過去のフレームと混ぜて、ギザギザや細かいノイズを滑らかにする方法。
  link: rendering/taa-upscaling.md
- terms: [アンチエイリアシング, anti-aliasing, MSAA, FXAA, ジャギー]
  text: 斜めの線のギザギザ（ジャギー）を、目立たなくする処理。
  link: rendering/taa-upscaling.md
- terms: [DLSS, FSR, アップスケーラ, アップスケール, upscaling, XeSS]
  text: 低い解像度で描いた画面を、高い解像度へ拡大して、きれいに見せる技術。
  link: rendering/taa-upscaling.md
- terms: [動的解像度, dynamic resolution]
  text: 負荷に応じて、描画の解像度をフレームごとに変える方法。
  link: rendering/taa-upscaling.md
- terms: [VRS, 可変レートシェーディング, variable rate shading]
  text: 画面の場所ごとに、シェーディングの細かさを変える機能（DX12 Ultimate）。
  link: rendering/taa-upscaling.md
- terms: [非同期コンピュート, async compute, Async Compute]
  text: 描画とコンピュートを、別のキューで同時に走らせて、GPU の空きを埋める方法。
  link: rendering/async-compute.md
- terms: [カスケードシャドウマップ, CSM, Cascaded Shadow Maps, カスケード, シャドウマップ, shadow map, 影マップ]
  text: 影を、カメラの近くは細かく、遠くは粗く、複数枚の影マップで描く方法。
  link: graphics/shadows/cascaded.md
- terms: [PCF, Percentage Closer Filtering, ソフトシャドウ]
  text: 影マップを、周囲の複数点で比べて平均し、影の縁を滑らかにする方法。
  link: graphics/shadows/pcf.md
- terms: [インポスター, impostor, ビルボード, billboard]
  text: 遠くの物を、常にカメラに向く 1 枚の画像で代用する方法。
  link: rendering/lod.md
- terms: [バーチャルテクスチャ, virtual texture, ミップストリーミング, テクスチャストリーミング]
  text: 巨大なテクスチャを、必要な部分・必要なミップだけメモリに置く方法。
  link: rendering/texture-streaming.md
- terms: [パーティクル, particle, Particle, パーティクルシステム]
  text: 煙・火花・雨など、小さな板を大量に飛ばして表現する効果。
  link: rendering/particles.md
- terms: [半透明, アルファブレンド, alpha blend, アルファテスト, alpha test, 透過]
  text: 後ろが透けて見える描き方。奥から順に重ねる必要があり、Early-Z が効きにくく、重くなりやすい。
  link: rendering/particles.md
- terms: [PIX, RenderDoc, Nsight, Nsight Graphics, Radeon GPU Profiler, GPU プロファイラ]
  text: GPU の描画を調べるツール。ドロー コールごとの時間・状態・シェーダーを確認できる。
  link: rendering/tools.md
- terms: [DirectX 11, DX11, D3D11, Direct3D 11]
  text: Windows の描画 API の 1 つ。このサイトの描画の例は、これを使っている。
  link: libs/imgui/basics.md
- terms: [DirectX 12, DX12, D3D12, Direct3D 12, Vulkan]
  text: 描画の細かい制御を、プログラマが行う新しい API。ドライバの仕事が少なく、CPU の負担を減らせるが、実装が難しい。
  link: libs/imgui/dx12.md
- terms: [DirectX 12 Ultimate, DX12 Ultimate, レイトレーシング, ray tracing, DXR]
  text: DX12 の新機能の一式（メッシュ シェーダー・レイトレーシング・VRS など）。対応 GPU が必要。
  link: rendering/mesh-shaders.md
- terms: [ドライバ, driver, グラフィックスドライバ, GPU ドライバ]
  text: API の命令を、GPU のハードウェア命令に変換するソフトウェア。DX11 では、この処理が CPU の負担になる。
  link: rendering/draw-calls.md
- terms: [同期待ち, ストール, stall, 読み戻し, readback]
  text: CPU と GPU が、互いの完了を待って止まること。GPU の結果を CPU で読むと、起きやすい。
  link: rendering/gpu-driven.md
- terms: [フェンス, fence, Fence, バリア, barrier]
  text: GPU の処理の順序や完了を、同期するための仕組み。
  link: rendering/async-compute.md
- terms: [InterlockedAdd, アトミックカウンター]
  text: 複数のスレッドが同時に使っても、壊れない、加算の操作。
  link: rendering/gpu-driven.md
- terms: [構造化バッファ, StructuredBuffer, structured buffer, RWStructuredBuffer, UAV]
  text: 構造体の配列を GPU に置くバッファ。UAV は、シェーダーから書き込める形のビュー。
  link: rendering/gpu-driven.md
- terms: [頂点キャッシュ, vertex cache]
  text: 変換済みの頂点を、一時的に覚えておき、同じ頂点を共有する三角形で再利用する、GPU の仕組み。
  link: rendering/mesh-shaders.md
- terms: [法線の円錐, normal cone, Normal Cone]
  text: 塊の全ての三角形の向きを、1 つの円錐で表したもの。裏向きの塊を、まとめて除外できる。
  link: rendering/mesh-shaders.md
- terms: [重心座標, barycentric, バリセントリック]
  text: 三角形の中の点を、3 頂点からの重みで表す座標。頂点の属性（UV・法線）の補間に使う。
  link: gamemath/interpolation.md
- terms: [境界球, bounding sphere, バウンディングスフィア, 境界ボリューム, bounding volume]
  text: 物体を包む球や箱。判定を速くするため、複雑な形の代わりに使う。
  link: gamemath/intersection.md
- terms: [アルファ, alpha, Alpha, 不透明度]
  text: 色の透け具合を表す値。0 で完全に透明、1 で不透明。
  link: gamemath/color.md
- terms: [RGBA, RGBA8, R11G11B10, DXGI_FORMAT, ピクセルフォーマット, テクスチャフォーマット]

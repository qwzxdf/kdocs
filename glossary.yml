- terms: [スプライン, spline, Catmull-Rom, B スプライン]
  text: 複数の点を、なめらかにつなぐ曲線。
  link: gamemath/curves.md
- terms: [イージング, easing, イーズ]
  text: 動きの速さに、緩急をつけて、自然に見せる技術。

  link: engine/scene.md
- terms: [アセット, asset, Asset]
  text: ゲームで使う、画像・音・モデル・データなどの素材。
  link: engine/resource.md
- terms: [ロード, load, ストリーミング, streaming]
  text: ファイルから、データをメモリに読み込むこと。
  link: optimize/loading.md
- terms: [パッケージ, pak, アーカイブ]
  text: 複数のファイルを、1 つにまとめたもの。
  link: engine/resource.md
- terms: [JSON]
  text: 人が読める、データの書き方（テキスト形式）。
  link: libs/serialization/nlohmann-json.md
- terms: [YAML]
  text: 人が書きやすい、データの書き方。インデントで構造を表す。
  link: libs/serialization/rapidyaml.md
- terms: [バイナリ, binary, Binary]
  text: 人が読めない、機械向けのデータ形式。小さく・速く読める。
  link: engine/serialization/index.md
- terms: [エンディアン, endian, リトルエンディアン]
  text: 複数バイトの数値を、メモリに並べる順序。
  link: engine/serialization/index.md
- terms: [UTF-8, UTF8]
  text: 世界中の文字を表す文字コード。ASCII と互換で、現在の標準。
  link: encoding/unicode-basics.md
- terms: [UTF-16, wstring, wchar_t]

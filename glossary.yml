- terms: [ステップ, step]
  text: 1 つの手順や、1 回の更新。
  link: gamemath/motion.md
- terms: [ネイティブ, native]
  text: そのコンピューター向けに、直接コンパイルされた実行形式。
  link: basics/compiler.md
- terms: [ステンシル, stencil, ステンシルテスト]

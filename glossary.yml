- terms: [XML, TOML, CSV]
  text: データを、テキストで書くための形式。
  link: engine/serialization/index.md
- terms: [RTS, リアルタイムストラテジー]
  text: ユニットを大量に動かす、リアルタイムの戦略ゲーム。

- terms: [ナビゲーション, navigation]
  text: 目的地までの道を探して、移動すること。
  link: libs/recast/overview.md
- terms: [天井, ピティ, pity]
  text: ガチャなどで、一定回数で当たりを保証する仕組み。
  link: gamemath/balance.md
- terms: [期待値, expected value]
  text: 何度も繰り返したときの、平均の値。確率と値の積の合計。

  link: gamemath/coordinate-systems.md
- terms: [左手系, left-handed, LH]
  text: 座標軸の取り方の 1 つ。Z が奥へ伸びる。DirectX・Unity が採用。このサイトの規約。
  link: gamemath/coordinate-systems.md
- terms: [行ベクトル, row vector, 行ベクトル規約]
  text: ベクトルを横に並べ、行列を右から掛ける書き方（v × M）。SimpleMath・DirectXMath が採用。
  link: gamemath/matrices.md
- terms: [列ベクトル, column vector, 列ベクトル規約]
  text: ベクトルを縦に並べ、行列を左から掛ける書き方（M × v）。数学の教科書・glTF の行列が採用。
  link: gamemath/matrices.md
- terms: [転置, transpose]
  text: 行列の行と列を、入れ替えること。
  link: gamemath/matrices.md
- terms: [逆行列, inverse]
  text: ある変換を、元に戻す行列。
  link: gamemath/matrices.md
- terms: [単位行列, identity]
  text: 何も変えない行列（数の 1 に当たる）。
  link: gamemath/matrices.md
- terms: [ビルド, build]
  text: ソースコードを、実行できるファイルにすること（コンパイル ＋ リンク）。
  link: basics/compiler.md
- terms: [コンパイラ, compiler, MSVC, Clang, GCC]
  text: ソースコードを、機械が実行できる命令に、翻訳するプログラム。
  link: basics/compiler.md
